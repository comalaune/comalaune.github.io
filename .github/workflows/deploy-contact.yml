name: Deploy contact API

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contact-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: contact-api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Validate deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$RESEND_API_KEY"
      - name: Deploy Worker and upload the Resend secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          mkdir -p .work
          node -e 'require("node:fs").writeFileSync(".work/worker-secrets.json", JSON.stringify({ RESEND_API_KEY: process.env.RESEND_API_KEY }), { mode: 0o600 })'
          trap 'rm -f .work/worker-secrets.json' EXIT
          npx wrangler deploy --config api/wrangler.jsonc --secrets-file .work/worker-secrets.json
